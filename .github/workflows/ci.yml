name: CI
on: [push, pull_request]
jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Pester
        shell: pwsh
        run: Install-Module Pester -Force -SkipPublisherCheck
      - name: Run tests
        shell: pwsh
        run: Invoke-Pester -Path ./Tests.ps1 -Output Detailed -CI
