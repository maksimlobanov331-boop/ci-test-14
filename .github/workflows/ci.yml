name: CI
on:
  push:
  pull_request:
  schedule:
    - cron: '0 2 * * *'
jobs:
  lint:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: PSScriptAnalyzer
        shell: pwsh
        run: |
          Install-Module -Name PSScriptAnalyzer -Force
          Invoke-ScriptAnalyzer -Path ./ConvertTo-Fahrenheit.ps1 -Severity Error,Warning -EnableExit
  test:
    runs-on: windows-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - name: Pester with coverage
        shell: pwsh
        run: |
          Install-Module Pester -RequiredVersion 5.7.1 -Force -SkipPublisherCheck
          $config = New-PesterConfiguration
          $config.Run.Path = './Tests.ps1'
          $config.Run.Exit = $true
          $config.CodeCoverage.Enabled = $true
          $config.CodeCoverage.Path = './Convert-Temperature.ps1'
          $config.Output.Verbosity = 'Detailed'
          Invoke-Pester -Configuration $config
      - name: Upload script
        uses: actions/upload-artifact@v4
        with:
          name: my-script
          path: Convert-Temperature.ps1
      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.xml
  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t ci-test-14 
